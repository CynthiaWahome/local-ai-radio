name: CI
on:
  pull_request:
    branches: [dev, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642205f719381563b326113
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/contracts
      - run: npm run build -w packages/engine
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
